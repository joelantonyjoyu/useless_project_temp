<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch the Air 💨</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Comic Sans MS", Arial, sans-serif;
    background: linear-gradient(#74d7ff, #dff8ff);
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game-container {
    width: 1000px;
    max-width: 95%;
    text-align: center;
}

h1 {
    font-size: 48px;
    color: #222;
    text-shadow: 3px 3px white;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 15px;
    color: #333;
}

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;

    background: white;

    border: 4px solid #222;
    border-radius: 15px;

    padding: 10px 20px;

    margin-bottom: 12px;

    box-shadow: 5px 5px #222;
}

.info {
    font-size: 22px;
    font-weight: bold;
}

button {
    font-family: "Comic Sans MS", Arial, sans-serif;

    font-size: 20px;
    font-weight: bold;

    padding: 10px 25px;

    border: 3px solid #222;
    border-radius: 12px;

    background: #ffd83d;

    cursor: pointer;

    box-shadow: 4px 4px #222;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px #222;
}


/* GAME AREA */

.game-area {

    position: relative;

    width: 950px;
    max-width: 100%;

    height: 550px;

    margin: auto;

    overflow: hidden;

    border: 5px solid #222;
    border-radius: 20px;

    background:
        linear-gradient(
            #63d4ff 0%,
            #bcefff 70%,
            #8bd36e 70%,
            #6fc35a 100%
        );

    box-shadow: 8px 8px #222;
}


/* CLOUDS */

.cloud {
    position: absolute;

    background: white;

    border-radius: 50px;

    opacity: 0.9;
}

.cloud1 {

    width: 130px;
    height: 45px;

    top: 60px;
    left: 80px;
}

.cloud1::before,
.cloud1::after {

    content: "";

    position: absolute;

    background: white;

    border-radius: 50%;
}

.cloud1::before {

    width: 60px;
    height: 60px;

    left: 20px;
    top: -30px;
}

.cloud1::after {

    width: 70px;
    height: 70px;

    right: 15px;
    top: -35px;
}


.cloud2 {

    width: 150px;
    height: 50px;

    top: 120px;
    right: 90px;
}

.cloud2::before,
.cloud2::after {

    content: "";

    position: absolute;

    background: white;

    border-radius: 50%;
}

.cloud2::before {

    width: 65px;
    height: 65px;

    left: 25px;
    top: -35px;
}

.cloud2::after {

    width: 75px;
    height: 75px;

    right: 20px;
    top: -40px;
}


/* AIR */

.air {

    position: absolute;

    width: 45px;
    height: 45px;

    font-size: 38px;

    display: flex;

    justify-content: center;
    align-items: center;

    user-select: none;

    z-index: 5;
}


/* BASKET */

.basket {

    position: absolute;

    width: 130px;
    height: 75px;

    background: #c98238;

    border: 5px solid #222;

    border-radius:
        8px 8px 35px 35px;

    bottom: 25px;

    left: 410px;

    z-index: 10;

    box-shadow: 4px 4px #222;
}


/* BASKET OPENING */

.basket .opening {

    position: absolute;

    top: -16px;

    left: 7px;

    width: 106px;
    height: 25px;

    background: #7a431d;

    border: 5px solid #222;

    border-radius: 50%;

    z-index: 11;
}


/* BASKET LINES */

.basket::before,
.basket::after {

    content: "";

    position: absolute;

    top: 10px;
    bottom: 5px;

    width: 5px;

    background: #222;
}

.basket::before {
    left: 35px;
}

.basket::after {
    right: 35px;
}


/* FUNNY MESSAGE */

.comic-text {

    position: absolute;

    z-index: 50;

    max-width: 400px;

    padding: 10px 16px;

    background: white;

    border: 4px solid #222;

    border-radius: 15px;

    font-size: 22px;

    font-weight: bold;

    color: #222;

    box-shadow: 4px 4px #222;

    animation:
        comicPop 1.8s ease-out forwards;

    pointer-events: none;
}


@keyframes comicPop {

    0% {

        transform:
            scale(0.4)
            rotate(-5deg);

        opacity: 0;
    }

    15% {

        transform:
            scale(1.15)
            rotate(3deg);

        opacity: 1;
    }

    30% {

        transform:
            scale(1)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translateY(-70px);

        opacity: 0;
    }
}


/* START SCREEN */

.start-screen {

    position: absolute;

    inset: 0;

    background:
        rgba(255,255,255,0.92);

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}

.start-screen h2 {

    font-size: 42px;

    margin-bottom: 20px;
}

.start-screen p {

    font-size: 20px;

    margin-bottom: 15px;
}


/* FUNNY IMAGE */

.funny-image {

    position: absolute;

    width: 280px;

    max-height: 280px;

    object-fit: contain;

    z-index: 150;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    border: 5px solid #222;

    border-radius: 20px;

    background: white;

    box-shadow: 8px 8px #222;

    display: none;
}


/* INFINITY TEXT */

.infinity {

    font-size: 24px;

    font-weight: bold;

}


/* INSTRUCTIONS */

.instructions {

    margin-top: 20px;

    background: white;

    border: 3px solid #222;

    border-radius: 15px;

    padding: 12px;

    font-size: 18px;

    box-shadow: 4px 4px #222;
}

</style>
</head>


<body>


<div class="game-container">


<h1>
    Catch the Air 💨
</h1>


<div class="subtitle">

    Catch something that technically doesn't exist 😂

</div>


<div class="info-bar">


<div class="info">

    🏆 Score:
    <span id="score">0</span>

</div>


<div class="info infinity">

    ∞ Unlimited Game

</div>


<button id="startButton">

    ▶ Start Game

</button>


</div>



<div class="game-area" id="gameArea">


<!-- CLOUDS -->

<div class="cloud cloud1"></div>

<div class="cloud cloud2"></div>


<!-- BASKET -->

<div class="basket" id="basket">

    <div class="opening"></div>

</div>


<!-- FUNNY IMAGE -->

<img
    src="funny pic.jpg"
    id="funnyImage"
    class="funny-image"
    alt="Funny picture"
>


<!-- START SCREEN -->

<div
    class="start-screen"
    id="startScreen"
>


<h2>

    💨 Catch the Air!

</h2>


<p>

    Use the LEFT and RIGHT arrow keys.

</p>


<p>

    Catch as much air as possible!

</p>


<button id="startGameButton">

    START 😂

</button>


</div>


</div>


<div class="instructions">

    ⬅️ Move Left
    &nbsp;&nbsp; | &nbsp;&nbsp;

    ➡️ Move Right
    &nbsp;&nbsp; | &nbsp;&nbsp;

    🎯 Touch the basket opening

    &nbsp;&nbsp; | &nbsp;&nbsp;

    ♾️ Never Ends

</div>


</div>



<script>


/* ==========================
   GAME VARIABLES
========================== */


const gameArea =
    document.getElementById("gameArea");

const basket =
    document.getElementById("basket");

const scoreDisplay =
    document.getElementById("score");

const startButton =
    document.getElementById("startButton");

const startGameButton =
    document.getElementById("startGameButton");

const startScreen =
    document.getElementById("startScreen");

const funnyImage =
    document.getElementById("funnyImage");


let score = 0;

let gameRunning = false;

let basketX = 410;

let airInterval;


/* ==========================
   START BUTTON
========================== */


startButton.addEventListener(
    "click",
    startGame
);


startGameButton.addEventListener(
    "click",
    startGame
);


function startGame() {


    if (gameRunning) {

        return;

    }


    startScreen.style.display =
        "none";


    funnyImage.style.display =
        "block";


    setTimeout(() => {


        funnyImage.style.display =
            "none";


        beginGame();


    }, 2000);

}


/* ==========================
   BEGIN GAME
========================== */


function beginGame() {


    score = 0;

    scoreDisplay.textContent =
        score;


    gameRunning = true;


    basketX = 410;

    updateBasket();


    /*
       AIR KEEPS COMING FOREVER
    */

    airInterval = setInterval(() => {


        if (gameRunning) {

            createAir();

        }


    }, 700);

}


/* ==========================
   BASKET MOVEMENT
========================== */


document.addEventListener(
    "keydown",
    function(event) {


        if (!gameRunning) {

            return;

        }


        const basketWidth =
            basket.offsetWidth;


        const gameWidth =
            gameArea.clientWidth;


        if (event.key === "ArrowLeft") {


            event.preventDefault();


            basketX -= 25;


            if (basketX < 0) {

                basketX = 0;

            }


            updateBasket();

        }


        if (event.key === "ArrowRight") {


            event.preventDefault();


            basketX += 25;


            if (
                basketX >
                gameWidth - basketWidth
            ) {

                basketX =
                    gameWidth -
                    basketWidth;

            }


            updateBasket();

        }

    }
);


/* ==========================
   UPDATE BASKET
========================== */


function updateBasket() {

    basket.style.left =
        basketX + "px";

}


/* ==========================
   CREATE AIR
========================== */


function createAir() {


    if (!gameRunning) {

        return;

    }


    const air =
        document.createElement("div");


    air.className = "air";


    air.textContent = "💨";


    const gameWidth =
        gameArea.clientWidth;


    const airSize = 45;


    let airX =
        Math.random() *
        (gameWidth - airSize);


    let airY = -50;


    air.style.left =
        airX + "px";


    air.style.top =
        airY + "px";


    gameArea.appendChild(air);


    let caught = false;


    const fallSpeed =
        3 + Math.random() * 2;


    const fallInterval =
        setInterval(() => {


        if (!gameRunning) {


            clearInterval(
                fallInterval
            );


            air.remove();


            return;

        }


        airY += fallSpeed;


        air.style.top =
            airY + "px";


        /* =====================
           CONTACT DETECTION
        ===================== */


        const airLeft =
            airX;


        const airRight =
            airX +
            air.offsetWidth;


        const airTop =
            airY;


        const airBottom =
            airY +
            air.offsetHeight;


        const basketLeft =
            basketX + 8;


        const basketRight =
            basketX +
            basket.offsetWidth -
            8;


        const basketTop =
            gameArea.clientHeight -
            basket.offsetHeight -
            25;


        const basketBottom =
            basketTop + 20;


        const touching =

            airRight >
            basketLeft &&

            airLeft <
            basketRight &&

            airBottom >
            basketTop &&

            airTop <
            basketBottom;


        /* =====================
           AIR CAUGHT
        ===================== */


        if (
            !caught &&
            touching
        ) {


            caught = true;


            score++;


            scoreDisplay.textContent =
                score;


            showFunnyCatchMessage();


            clearInterval(
                fallInterval
            );


            air.remove();


            return;

        }


        /* =====================
           REMOVE MISSED AIR
        ===================== */


        if (
            airY >
            gameArea.clientHeight +
            50
        ) {


            clearInterval(
                fallInterval
            );


            air.remove();

        }


    }, 20);

}


/* ==========================
   FUNNY MESSAGES
========================== */


function showFunnyCatchMessage() {


    const messages = [


        "Vella panik podaaa..... 😂",

        "vella kazhiv inda da🤣",

        "Ayyo! Ayyo!💨😂",

        "nthinada konnitt😭",

        "adi sake😂",

        "suuuiiiiiiii 🤣",

        "Nee kollallo mone! 😂🔥",

        "Ithu enthu paniyaa! 🤦😂",

        "Pidichu alle! 😎💨",

        "Entha oru catching! 😂👏",

        "Air ine vare pidikkunnu! 🤣",

        "Ithinu vendi aano ithra effort? 😂",

        "Mission Useless! 🫡",

        "Air caught! 💨😂",

        "World's most useless catch! 🏆😂",

        "Bro caught AIR! 😭😂",

        "Nothing successfully captured! 🤣",

        "Achievement unlocked: AIR! 🏆💨"

    ];


    const randomMessage =

        messages[
            Math.floor(
                Math.random() *
                messages.length
            )
        ];


    showComicText(

        basketX + 10,

        basket.offsetTop - 70,

        randomMessage

    );

}


/* ==========================
   COMIC TEXT
========================== */


function showComicText(
    x,
    y,
    text
) {


    const comic =
        document.createElement("div");


    comic.className =
        "comic-text";


    comic.textContent =
        text;


    comic.style.left =
        x + "px";


    comic.style.top =
        y + "px";


    gameArea.appendChild(
        comic
    );


    setTimeout(() => {

        comic.remove();

    }, 1800);

}


</script>

</body>
</html>
